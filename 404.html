<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조이로그</title>
<meta property="og:title" content="조이로그 함께 쓰기 초대">
<meta property="og:description" content="앱에서 초대 코드를 입력하면 아기 기록을 함께 볼 수 있어요.">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
         background:#faf8f4; color:#2e2a24; }
  @media (prefers-color-scheme: dark) { body { background:#17161a; color:#e9e6e0; } }
  main { max-width:32rem; padding:2rem 1.5rem; text-align:center; }
  h1 { font-size:1.6rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  p  { margin:0 0 1.5rem; line-height:1.7; opacity:.75; font-size:.95rem; }
  nav a { display:inline-block; margin:0 .5rem; font-size:.9rem; color:inherit; opacity:.6; }
  nav a:hover { opacity:1; }
  .code { display:flex; justify-content:center; gap:.4rem; margin:1.2rem 0 1.6rem; }
  .code span { width:2.6rem; height:3.2rem; display:grid; place-items:center;
               font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums;
               background:rgba(224,137,96,.14); color:#c96f45; border-radius:.8rem; }
  @media (prefers-color-scheme: dark) { .code span { background:rgba(224,137,96,.18); color:#e8a077; } }
  .code-long { font-family:ui-monospace,Menlo,monospace; font-size:1.1rem; font-weight:700;
               letter-spacing:.06em; margin:1.2rem 0 1.6rem; word-break:break-all; }
  ol { text-align:left; display:inline-block; margin:0 0 1.8rem; padding-left:1.4rem;
       line-height:2; font-size:.95rem; }
  .store { display:inline-block; padding:.85rem 1.6rem; border-radius:1rem; background:#e08960;
           color:#fff; text-decoration:none; font-weight:600; font-size:.95rem; margin-bottom:1.6rem; }
  .store:active { opacity:.85; }
  .note { font-size:.8rem; opacity:.5; margin-bottom:2rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="invite" hidden>
    <h1>함께 쓰기 초대장이에요</h1>
    <p>배우자가 조이로그에서 아기 기록을 함께 보자고 초대했어요.</p>
    <div class="code" id="code-boxes"></div>
    <div class="code-long" id="code-long" hidden></div>
    <ol>
      <li>조이로그 앱을 설치해 주세요 (이미 있다면 최신 버전으로 업데이트)</li>
      <li>앱에서 로그인해 주세요</li>
      <li>설정 → <strong>“초대 코드로 참여”</strong>를 눌러 주세요</li>
      <li>위의 코드를 입력하면 바로 연결돼요</li>
    </ol>
    <div>
      <a class="store" href="https://apps.apple.com/kr/app/id6804470047">App Store에서 받기</a>
    </div>
    <p class="note">초대 코드는 만든 지 24시간 동안, 한 번만 쓸 수 있어요.<br>
    시간이 지났다면 배우자에게 새 코드를 부탁해 주세요.</p>
  </section>
  <section id="notfound" hidden>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 잘못 입력됐을 수 있어요.</p>
  </section>
  <nav>
    <a href="/">홈</a>
    <a href="/support">도움말</a>
  </nav>
</main>
<script>
  var m = location.pathname.match(/^\/join\/([0-9]{6})\/?$/);
  var long = location.pathname.match(/^\/join\/([A-Za-z0-9]{6,32})\/?$/);
  if (m) {
    document.title = "조이로그 함께 쓰기 초대";
    var boxes = document.getElementById("code-boxes");
    m[1].split("").forEach(function (d) {
      var s = document.createElement("span");
      s.textContent = d;
      boxes.appendChild(s);
    });
    document.getElementById("invite").hidden = false;
  } else if (long) {
    document.title = "조이로그 함께 쓰기 초대";
    document.getElementById("code-boxes").hidden = true;
    var el = document.getElementById("code-long");
    el.textContent = long[1];
    el.hidden = false;
    document.getElementById("invite").hidden = false;
  } else {
    document.getElementById("notfound").hidden = false;
  }
</script>
</body>
</html>
